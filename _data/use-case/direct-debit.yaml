# yaml-language-server: $schema=./use-case-profile.schema.json
#
# DRAFT - prototype of the use-case profile format. The format is defined in use-case-profile.schema.json.
#
# A profile describes one business scenario on top of the generic HortiApi schema:
# which steps exist, and per step which fields are read (request) or filled (response).
#
# usage:
#   required    must be present
#   optional    may be present, is used when present
#   conditional required under the condition given in `when`
#   not-used    deliberately not part of this use-case (covers the whole object)
# Fields that are not listed are ignored by the server.
#
# `call` repeats method and path of `operationId` for readability.
# `after` marks a step that can be called at any time after the named step.
#
# Paths are relative to the request/response model of the operation, `[]` marks an array.
# Lists with keyed entries are described per key: `resources`, `features`, `references`.

id: horti-api/use-case:direct-debit
title: Direct Debit
status: proposed
summary: >-
  A supplier submits an order that is collected from the customer's bank account
  by AI2 through SEPA direct debit, once the invoice date has passed.
hortiapi: ">=3.0.0-rc.86"
docs: https://hortiapi.com/use-case/direct-debit

steps:

  create:
    actor: client
    level: core
    title: Submit draft order
    description: Submit the order as a draft, with or without its lines.
    operationId: HAPI3OrderUpdate
    call: POST /order
    request:
      kind:
        usage: required
        value: order/kind:direct-debit
      state:
        usage: required
        value: order/direct-debit-state:draft
      orderDate:
        usage: required
        description: Transaction date.
        mapping: { ai2-file: 12 }
      dispatchDate:
        usage: optional
      deliveryDate:
        usage: optional
      invoiceDate:
        usage: required
        description: Collection date (NL incassodatum). The AI2 batch picks up an order when its invoice date and time have passed.
        mapping: { ai2-file: 14 }
      description:
        usage: optional
        description: Reference of the collection order (NL opdrachtreferentie).
        constraint: max 35 characters
        mapping: { ai2-file: 20 }
      supplier.id:
        usage: optional
        description: Id of the supplier party on this server. Prefer the GLN or the AI2 account number; when the id is given it is used first.
      supplier.gln:
        usage: optional
        description: GLN of the supplier (NL verkoper) party.
      supplier.resources:
        resources:
          ai2/account-number:
            usage: conditional
            when: The supplier can not be found with the id or the GLN.
            description: AI2 account number of the supplier (NL verkoper) party.
            mapping: { ai2-file: 3 }
      customer.id:
        usage: optional
        description: Id of the customer party on this server. Prefer the GLN or the AI2 account number; when the id is given it is used first.
      customer.gln:
        usage: optional
        description: GLN of the customer (NL koper) party.
      customer.resources:
        resources:
          ai2/account-number:
            usage: conditional
            when: The customer can not be found with the id or the GLN.
            description: AI2 account number of the customer (NL koper) party.
            mapping: { ai2-file: 4 }
      resources:
        resources:
          reference/supplier:
            usage: optional
            description: The supplier's own id for this order.
      charges:
        usage: not-used
        description: Charges are not collected; the amount is derived from the lines only.
      lines:
        usage: optional
        description: The lines of the order. Leave empty to add the lines with `modify-lines`.
      lines[].product.industryId:
        usage: required
        description: VBN product code.
        mapping: { ai2-file: 6 }
      lines[].product.manufacturer.gln:
        usage: optional
        description: GLN of the grower.
      lines[].product.description:
        usage: required
        description: Article description.
        constraint: max 50 characters
        mapping: { ai2-file: 21 }
      lines[].product.features:
        features:
          "*": { usage: conditional, when: Prescribed by VBN for the product code., description: The sorting features that VBN prescribes for the product. The API takes any number of features., mapping: { ai2-file: "15-18" } }
          L11: { usage: optional, description: Number of stems per bunch. }
          S98: { usage: optional, description: Quality group., mapping: { ai2-file: 19 } }
          S62: { usage: optional, description: Country of origin (ISO 3166-1)., mapping: { ai2-file: 22 } }
      lines[].quantity.value:
        usage: required
        description: Number of units (boxes). Use a negative value for a credit.
        constraint: -9999 to 9999
        mapping: { ai2-file: 7 }
      lines[].quantity.unit:
        usage: required
        value: box
      lines[].packing.box.quantity:
        usage: required
        description: Number of pieces per (box) unit.
        constraint: 1 to 9999
        mapping: { ai2-file: 9 }
      lines[].packing.box.code:
        usage: required
        description: Packaging code (NL emballagecode).
        mapping: { ai2-file: 11 }
      lines[].price.type:
        usage: required
        value: invoice
      lines[].price.amount.value:
        usage: required
        description: Price per piece.
        constraint: max 3 decimals
        mapping: { ai2-file: 10 }
      lines[].price.amount.currency:
        usage: required
        value: EUR
      lines[].references:
        references:
          VN:  { usage: optional, description: Transaction reference of the supplier (as in EDI/VMP - NL kweker)., constraint: max 26 characters, mapping: { ai2-file: 27 } }
          ACL: { usage: optional, description: Service code (legacy)., constraint: max 4 characters, mapping: { ai2-file: 28 } }
          ON:  { usage: optional, description: Transaction reference of the customer (as in EDI/VMP - NL koper)., constraint: max 26 characters, mapping: { ai2-file: 29 } }
          BT:  { usage: optional, description: Logistic barcode., constraint: max 32 characters, mapping: { ai2-file: 30 } }
      lines[].resources:
        resources:
          reference/supplier: { usage: optional, description: The supplier's own id for this line. }
          reference/customer: { usage: optional, description: The customer's own id for this line. }
      lines[].charges:
        usage: not-used
        description: See `charges`.
    response:
      id:
        usage: required
        description: Id to use in all following steps.
      state:
        usage: required
        value: order/direct-debit-state:draft
      supplier.id:   { usage: required }
      supplier.gln:  { usage: required }
      supplier.name: { usage: required }
      customer.id:   { usage: required }
      customer.gln:  { usage: required }
      customer.name: { usage: required }
    errors:
      - type: bad-request/party-unknown
        when: The supplier or customer can not be found with the given id, GLN or AI2 account number.
      - type: forbidden/order-owner
        when: The calling company is not the supplier of the order.
    next: [modify, modify-lines, delete, collect]

  modify:
    actor: client
    level: extended
    title: Change draft order
    description: Send the order again with its id. Same fields as `create`, without the lines; change lines with `modify-lines`.
    extends: create
    when: state is order/direct-debit-state:draft
    request:
      id:
        usage: required
      lines:
        usage: not-used
    errors:
      - type: conflict/order-not-draft
        when: The order is no longer in draft.
    next: [modify, modify-lines, delete, collect]

  modify-lines:
    actor: client
    level: extended
    title: Add or change a single line
    description: Add a line to the order or change one. Line fields are the same as `lines[]` in `create`, without the `lines[].` prefix.
    operationId: HAPI3OrderLineUpdate
    call: POST /order-line
    when: state is order/direct-debit-state:draft
    request:
      order:
        usage: required
        description: Id of the order the line belongs to.
      id:
        usage: conditional
        when: Changing an existing line.
    errors:
      - type: conflict/order-not-draft
        when: The order is no longer in draft.
    next: [modify, modify-lines, delete, collect]

  delete:
    actor: client
    level: extended
    title: Delete draft order
    description: Withdraw the order before AI2 has picked it up. After this the order is gone, `status` answers with `not-found/order`.
    operationId: HAPI3OrderDelete
    call: DELETE /order/{orderId}
    when: state is order/direct-debit-state:draft
    parameters:
      orderId:
        usage: required
        description: The `id` received in `create`.
    errors:
      - type: conflict/order-not-draft
        when: The order is no longer in draft.
      - type: not-found/order
        when: The id is not known on this server.

  collect:
    actor: server
    title: AI2 batch picks up the order
    trigger: Monday to Friday 13:00-13:30 (provisional), for orders whose invoiceDate has passed.
    changes:
      state:
        from: order/direct-debit-state:draft
        to: order/direct-debit-state:awaiting-processing
    description: The order is locked and can no longer be modified or deleted.
    next: [submit-to-bank]

  submit-to-bank:
    actor: server
    title: Collection is submitted to the bank
    changes:
      state:
        from: order/direct-debit-state:awaiting-processing
        to: order/direct-debit-state:collection-in-progress
      resources:
        add: [ai2/collection-batch, ai2/collection-date]
    description: The order has been submitted to the bank for collection. AI2 is waiting to receive the funds from the bank. (The SEPA return period still applies to received funds).
    next: [settle]

  settle:
    actor: server
    title: Funds are settled to the supplier
    changes:
      state:
        from: order/direct-debit-state:collection-in-progress
        to: order/direct-debit-state:payout-settled
      resources:
        add: [ai2/payment-batch, ai2/payment-date]
    description: AI2 has received the funds from the bank and has paid the collected amount to the supplier in a payment batch.

  reject:
    actor: server
    title: Order is rejected
    after: create
    changes:
      state:
        to: order/direct-debit-state:rejected
    description: AI2 can reject the order from every state. The order is not processed further, contact AI2 for follow-up.

  status:
    actor: client
    level: core
    title: Follow progress
    after: create
    description: Poll the order to see how far AI2 has processed it.
    operationId: HAPI3OrderGet
    call: GET /order/{orderId}
    parameters:
      orderId:
        usage: required
        description: The `id` received in `create`.
      includeLines:
        usage: optional
        description: Set to true to also receive the lines.
    response:
      state:
        usage: required
        values:
          - order/direct-debit-state:draft
          - order/direct-debit-state:awaiting-processing
          - order/direct-debit-state:collection-in-progress
          - order/direct-debit-state:payout-settled
          - order/direct-debit-state:rejected
      resources:
        resources:
          ai2/collection-batch: { usage: conditional, when: From state collection-in-progress., description: Number of the AI2 collection batch. }
          ai2/collection-date:  { usage: conditional, when: From state collection-in-progress., description: "Point in time the AI2 collection batch ran, in UTC, for example 2026-11-24T14:30:00Z." }
          ai2/payment-batch:    { usage: conditional, when: From state payout-settled., description: Number of the AI2 payment batch. }
          ai2/payment-date:     { usage: conditional, when: From state payout-settled., description: "Point in time the AI2 payment batch ran, in UTC, for example 2026-11-24T14:30:00Z." }
      total.lines:  { usage: required }
      total.pieces: { usage: required }
      total.net:    { usage: required, description: Amount that is collected. }
      lines[].id:   { usage: required }
      lines[].article:
        usage: optional
        description: VBN article resolved by the server from `product.industryId`.
      lines[].packing:
        usage: optional
        description: Completed by the server with the defaults of the packaging code.
    errors:
      - type: not-found/order
        when: The id is not known on this server, or the draft order was deleted.
      - type: forbidden/order-owner
        when: The calling company is not a party of the order.
